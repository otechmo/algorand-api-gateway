[algokit]
min_version = "v2.0.0"

[project]
type = "backend"
name = "algorand-api-gateway"

[project.run]
start = { commands = ['npm start'], description = 'Start Algorand API gateway' }
test = { commands = ['npm test'], description = 'Run gateway tests' }
check = { commands = ['npm run check'], description = 'Run gateway syntax checks' }
